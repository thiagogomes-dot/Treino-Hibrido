name = "treino-th-push"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

# Lembretes: o cron roda a cada minuto e manda no horário escolhido no app (plano grátis do Cloudflare)
[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "https://thiagogomes-dot.github.io/Treino-Hibrido/"
VAPID_PUBLIC = "BNZaASVC1qqscvLwT2pBtH8cNoaVsdG2TypnZvv0ouv_FaBLsPbbY9OP4ATlRK99LpzKeZ-i38FQc2IOeJy8EV8"
# VAPID_PRIVATE é segredo: `npx wrangler secret put VAPID_PRIVATE` (nunca no repositório)

[[kv_namespaces]]
binding = "SUBS"
id = "983758b519e9464e8ed95fdc0b1a19bb"

# IA grátis do Cloudflare (Workers AI) para responder os comentários na hora
[ai]
binding = "AI"
