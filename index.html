<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Treino TH</title>
<meta name="description" content="Treino híbrido do Thiago: musculação PPL, futevôlei e protocolo do joelho.">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="Treino TH">
<meta name="apple-mobile-web-app-title" content="Treino TH">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#07060d; --text:#f2effb; --muted:#a6a2bd; --dim:#6c6884;
  --stroke:rgba(255,255,255,.09); --stroke2:rgba(255,255,255,.18);
  --glass-a:rgba(255,255,255,.075); --glass-b:rgba(255,255,255,.02);
  --push:#ffb86b; --pull:#a98bff; --legs:#ff6f91; --cardio:#4fe3c1; --rest:#7d7a95; --ok:#4fe3c1; --warn:#ffcf5c;
  --acc:#a98bff;
  --display:'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --body:'Manrope', 'Segoe UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#07060d; --text:#f2effb; } }
:root[data-theme="dark"]{ --bg:#07060d; --text:#f2effb; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; border-radius:10px; }

/* fundo com orbes */
.bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; transition:background .6s ease; }
.orb.a{ width:75vw; height:75vw; max-width:520px; max-height:520px; top:-18vh; right:-25vw; background:var(--acc); opacity:.38; }
.orb.b{ width:60vw; height:60vw; max-width:420px; max-height:420px; top:38vh; left:-30vw; background:#4b2bd6; opacity:.35; }
.orb.c{ width:50vw; height:50vw; max-width:360px; max-height:360px; bottom:-10vh; right:-10vw; background:#0d8f7a; opacity:.25; }
.grain{ position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size:3px 3px; }

main{ max-width:520px; margin:0 auto; padding:18px 16px 190px; }

.glass{ position:relative; background:linear-gradient(155deg,var(--glass-a),var(--glass-b)); border:1px solid var(--stroke); border-radius:24px; backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 18px 50px -20px rgba(0,0,0,.6); }

/* topo */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:6px 2px 16px; }
.top h1{ font-family:var(--display); font-weight:800; font-size:34px; line-height:1; letter-spacing:-.02em; margin:0; }
.top h1 span{ color:var(--muted); font-weight:500; }
.top .sub{ color:var(--muted); font-size:13px; margin-top:6px; display:flex; align-items:center; gap:8px; }
.sync{ width:7px; height:7px; border-radius:50%; background:var(--dim); display:inline-block; }
.sync.cloud{ background:var(--ok); box-shadow:0 0 10px var(--ok); }
.iconbtn{ width:44px; height:44px; border-radius:14px; border:1px solid var(--stroke); background:var(--glass-a); display:grid; place-items:center; flex-shrink:0; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.iconbtn svg{ width:20px; height:20px; }

/* ciclo */
.cycle{ padding:18px 18px 16px; margin-bottom:12px; }
.cycle-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
.cycle-row b{ font-family:var(--display); font-size:17px; font-weight:700; }
.cycle-row small{ color:var(--muted); font-size:12.5px; text-align:right; }
.bar{ height:10px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; position:relative; }
.bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,#fff 0%),var(--acc)); box-shadow:0 0 18px var(--acc); transition:width .6s cubic-bezier(.2,.8,.2,1); }
.bar.time{ height:4px; margin-top:8px; }
.bar.time i{ background:rgba(255,255,255,.35); box-shadow:none; }
.legend{ display:flex; justify-content:space-between; color:var(--dim); font-size:11.5px; margin-top:6px; }
.cycle-done{ margin-top:12px; padding:12px 14px; border-radius:16px; background:rgba(255,207,92,.08); border:1px solid rgba(255,207,92,.3); color:var(--warn); font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; }

/* semana */
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; }
.wd{ border:1px solid var(--stroke); background:var(--glass-b); border-radius:16px; padding:9px 0 8px; text-align:center; position:relative; transition:border-color .2s, background .2s; }
.wd .l{ font-size:11.5px; color:var(--muted); font-weight:600; }
.wd .s{ width:22px; height:22px; margin:5px auto 0; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; font-size:12px; }
.wd.sel{ border-color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); box-shadow:0 0 22px -6px var(--c); }
.wd.today .l{ color:var(--text); }
.wd.today::after{ content:''; position:absolute; top:5px; right:7px; width:5px; height:5px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
.wd.done .s{ background:var(--c); border-color:var(--c); color:#0b0a12; box-shadow:0 0 12px var(--c); }
.wd.part .s{ border-color:var(--c); border-style:dashed; }
.wd.off .s{ border-style:dotted; opacity:.5; }

/* treino */
.day-head{ padding:20px 18px; margin-bottom:12px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.chip{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); border:1px solid color-mix(in srgb,var(--c) 35%,transparent); }
.day-head h2{ font-family:var(--display); font-size:26px; font-weight:800; line-height:1.1; letter-spacing:-.015em; margin:0 0 6px; }
.day-head p{ margin:0; color:var(--muted); font-size:13.5px; }

.steps{ margin-top:16px; }
.steps-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }
.steps-top b{ font-weight:700; }
.steps-top span{ color:var(--muted); }
.segs{ display:flex; gap:4px; }
.seg{ flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,.08); transition:background .3s, box-shadow .3s; }
.seg.on{ background:var(--acc); box-shadow:0 0 10px var(--acc); }
.seg.cur{ background:color-mix(in srgb,var(--acc) 35%,transparent); }

.ex{ margin-bottom:10px; overflow:hidden; border-radius:22px; }
.ex-h{ width:100%; display:flex; gap:12px; align-items:center; padding:15px 16px; border:0; background:none; text-align:left; }
.ex-st{ width:30px; height:30px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--muted); transition:all .25s; }
.ex.complete .ex-st{ background:var(--acc); border-color:var(--acc); color:#0b0a12; box-shadow:0 0 14px var(--acc); }
.ex-t{ flex:1; min-width:0; }
.ex-t .n{ font-weight:600; font-size:15px; line-height:1.3; }
.ex-t .m{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.ex.complete .ex-t .n{ color:var(--muted); }
.chev{ color:var(--dim); transition:transform .25s; font-size:12px; }
.ex.open .chev{ transform:rotate(180deg); }
.ex-b{ padding:0 16px 16px; display:none; }
.ex.open .ex-b{ display:block; }
.obs{ font-size:13px; color:var(--muted); margin:0 0 10px; }
.last{ font-size:12.5px; color:var(--text); background:rgba(255,255,255,.05); border:1px solid var(--stroke); border-radius:12px; padding:8px 11px; margin-bottom:10px; }
.last em{ font-style:normal; color:var(--acc); font-weight:700; }
.wrow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--stroke); }
.wrow .lbl{ flex:1; font-size:13.5px; font-weight:600; }
.wrow .lbl small{ display:block; font-size:12px; color:var(--muted); font-weight:500; }
.wrow .fld{ width:132px; border-color:color-mix(in srgb,var(--acc) 40%,transparent); }
.hbar{ display:block; height:4px; margin-top:8px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; }
.hbar i{ display:block; height:100%; border-radius:99px; background:var(--acc); box-shadow:0 0 10px var(--acc); transition:width .4s cubic-bezier(.2,.8,.2,1); }
.sprog{ margin-bottom:12px; }
.sprog-top{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px; }
.sprog-top b{ color:var(--text); font-weight:700; }
.sbar{ display:flex; gap:5px; }
.sbar i{ flex:1; height:12px; border-radius:99px; background:rgba(255,255,255,.08); transition:background .3s, box-shadow .3s; }
.sbar i.on{ background:var(--acc); box-shadow:0 0 12px var(--acc); }
.srow{ display:flex; gap:8px; align-items:stretch; }
.srow .btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; }
.srow .btn svg{ width:20px; height:20px; }
.srow .undo{ height:54px; border-radius:18px; padding:0 14px; }
.btn.ok:disabled{ opacity:1; background:color-mix(in srgb,var(--acc) 16%,transparent); color:var(--acc); border-color:color-mix(in srgb,var(--acc) 40%,transparent); box-shadow:none; }
.set{ display:grid; grid-template-columns:26px 1fr 52px; gap:8px; align-items:center; padding:5px 0; }
.set.t{ grid-template-columns:26px 1fr 52px; }
.set .n{ font-size:12px; color:var(--dim); font-weight:700; text-align:center; }
.fld{ display:flex; align-items:center; height:46px; border-radius:14px; background:rgba(0,0,0,.28); border:1px solid var(--stroke); padding:0 10px; gap:6px; }
.fld:focus-within{ border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent); }
.fld input{ width:100%; min-width:0; border:0; outline:0; background:none; font-size:17px; font-weight:700; }
.fld input::placeholder{ color:var(--dim); font-weight:600; }
.fld span{ font-size:11.5px; color:var(--dim); }
.tlabel{ font-size:14px; color:var(--muted); }
.chk{ height:46px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.04); display:grid; place-items:center; transition:all .2s; }
.chk svg{ width:20px; height:20px; opacity:.45; }
.set.done .chk{ background:var(--acc); border-color:var(--acc); box-shadow:0 0 16px -2px var(--acc); }
.set.done .chk svg{ opacity:1; color:#0b0a12; }
.set.done .fld{ opacity:.7; }
.yt{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:600; color:#ff7a70; text-decoration:none; padding:7px 11px; border-radius:11px; background:rgba(255,90,80,.08); border:1px solid rgba(255,90,80,.22); }

.card{ padding:18px; margin-bottom:12px; }
.card h3{ font-family:var(--display); font-weight:700; font-size:18px; margin:0 0 4px; }
.card .hint{ color:var(--muted); font-size:13px; margin:0 0 14px; }

.pain-val{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
.pain-val b{ font-family:var(--display); font-size:40px; font-weight:800; line-height:1; color:var(--pc,var(--text)); text-shadow:0 0 20px var(--pc,transparent); }
.pain-val span{ color:var(--muted); font-size:13px; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:34px; background:none; }
input[type=range]::-webkit-slider-runnable-track{ height:8px; border-radius:99px; background:linear-gradient(90deg,#4fe3c1,#ffcf5c 55%,#ff5f7e); }
input[type=range]::-moz-range-track{ height:8px; border-radius:99px; background:linear-gradient(90deg,#4fe3c1,#ffcf5c 55%,#ff5f7e); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.15), 0 0 16px rgba(255,255,255,.5); }
input[type=range]::-moz-range-thumb{ width:26px; height:26px; border:0; border-radius:50%; background:#fff; box-shadow:0 0 16px rgba(255,255,255,.5); }
.scale{ display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }

.btn{ width:100%; height:54px; border-radius:18px; border:1px solid color-mix(in srgb,var(--acc) 60%,transparent); background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff 15%),var(--acc)); color:#0b0a12; font-weight:800; font-size:16px; box-shadow:0 10px 30px -8px var(--acc), inset 0 1px 0 rgba(255,255,255,.5); transition:transform .15s, opacity .2s; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.35; box-shadow:none; }
.btn.ghost{ background:rgba(255,255,255,.05); color:var(--text); border-color:var(--stroke2); box-shadow:none; }
.btn.sm{ height:42px; width:auto; padding:0 16px; font-size:14px; border-radius:14px; }

.donecard{ text-align:center; padding:26px 18px; margin-bottom:12px; }
.donecard .big{ width:64px; height:64px; margin:0 auto 12px; border-radius:50%; background:var(--acc); color:#0b0a12; display:grid; place-items:center; box-shadow:0 0 40px var(--acc); }
.donecard .big svg{ width:30px; height:30px; }
.donecard h2{ font-family:var(--display); font-size:24px; margin:0 0 4px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
.stat{ background:rgba(255,255,255,.04); border:1px solid var(--stroke); border-radius:16px; padding:12px 8px; text-align:center; }
.stat b{ display:block; font-family:var(--display); font-size:20px; font-weight:800; }
.stat span{ font-size:11.5px; color:var(--muted); }

/* progresso */
.sel{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(0,0,0,.3); padding:0 14px; margin-bottom:12px; }
.chart{ width:100%; height:auto; display:block; }
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ display:flex; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--stroke); font-size:13.5px; }
.hist li:last-child{ border-bottom:0; }
.hist .d{ color:var(--muted); font-size:12.5px; }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); box-shadow:0 0 8px var(--c); }
.empty{ color:var(--muted); font-size:14px; text-align:center; padding:22px 8px; }

.ctx{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.ctx button{ height:38px; padding:0 14px; border-radius:99px; border:1px solid var(--stroke2); background:rgba(255,255,255,.04); font-size:13px; font-weight:600; }
.ctx button[aria-pressed=true]{ background:var(--acc); border-color:var(--acc); color:#0b0a12; box-shadow:0 0 14px -2px var(--acc); }
.alert{ padding:14px 16px; border-radius:18px; font-size:13.5px; margin-bottom:12px; border:1px solid; }
.alert.bad{ background:rgba(255,95,126,.08); border-color:rgba(255,95,126,.35); color:#ffb3c1; }
.alert.good{ background:rgba(79,227,193,.07); border-color:rgba(79,227,193,.3); color:#aef3e2; }
.proto{ list-style:none; margin:0; padding:0; }
.proto li{ padding:10px 0; border-bottom:1px solid var(--stroke); font-size:13.5px; color:var(--muted); }
.proto li:last-child{ border-bottom:0; }
.proto b{ color:var(--text); font-weight:600; display:block; }

/* timer */
.timer{ position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); max-width:496px; margin:0 auto; padding:10px 10px 10px 14px; border-radius:22px; display:flex; align-items:center; gap:12px; z-index:20; transform:translateY(20px); opacity:0; pointer-events:none; transition:transform .3s, opacity .3s; }
.timer.on{ transform:none; opacity:1; pointer-events:auto; }
.timer.end{ border-color:var(--acc); box-shadow:0 0 36px -4px var(--acc); }
/* últimos 10 segundos: tudo vermelho e pulsando */
.timer.warn{ border-color:#ff3b5c; box-shadow:0 0 40px -4px #ff3b5c; background:linear-gradient(155deg,rgba(255,59,92,.28),rgba(255,59,92,.08)); animation:tpulse 1s ease-in-out infinite; }
.timer.warn #tclock{ color:#ff3b5c; text-shadow:0 0 16px rgba(255,59,92,.8); }
.timer.warn #tlabel{ color:#ff9aab; }
.timer.warn #ringfg{ stroke:#ff3b5c; }
@keyframes tpulse{ 50%{ box-shadow:0 0 60px 2px #ff3b5c; } }
.install{ display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:12px; }
.install .tx{ flex:1; font-size:13.5px; color:var(--muted); } .install .tx b{ display:block; color:var(--text); font-size:15px; }
.install .btn{ width:auto; flex-shrink:0; }
.optrow input[type=time]{ height:42px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(0,0,0,.3); padding:0 10px; color-scheme:dark; }
.ring{ width:44px; height:44px; flex-shrink:0; }
.timer .tt{ flex:1; }
.timer .tt b{ font-family:var(--display); font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; display:block; line-height:1.1; }
.timer .tt span{ font-size:12px; color:var(--muted); }
.tbtn{ height:40px; min-width:44px; padding:0 10px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(255,255,255,.06); font-size:13px; font-weight:700; }

/* nav */
nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:21; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(7,6,13,0),rgba(7,6,13,.85) 40%); }
.brand{ display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.01em; color:var(--push); margin-bottom:2px; }
.brand img{ width:20px; height:20px; border-radius:6px; }
.rules{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.rule{ padding:14px; border-radius:20px; }
.rule .e{ font-size:22px; line-height:1; margin-bottom:10px; }
.rule b{ display:block; font-size:14px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.rule p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.5; }
.why p{ margin:0 0 10px; color:var(--muted); font-size:14px; } .why p:last-child{ margin:0; }
.why strong{ color:var(--text); font-weight:600; }
.wk{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13.5px; margin-top:12px; }
.wk dt{ color:var(--dim); font-weight:700; } .wk dd{ margin:0; color:var(--muted); }
.wk dd i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); box-shadow:0 0 8px var(--c); }
@media (max-width:360px){ .rules{ grid-template-columns:1fr; } }
.tabs .in{ max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px; border-radius:24px; }
.tabs button{ height:52px; border:0; border-radius:18px; background:none; color:var(--muted); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:background .2s,color .2s; }
.tabs button svg{ width:20px; height:20px; }
.tabs button[aria-current=page]{ color:var(--text); background:color-mix(in srgb,var(--acc) 20%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent), 0 0 20px -6px var(--acc); }

/* ajustes */
.sheet{ position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.sheet.on{ display:flex; }
.sheet .panel{ width:100%; max-width:520px; padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px)); border-radius:28px 28px 0 0; background:linear-gradient(160deg,rgba(32,28,52,.92),rgba(14,12,24,.96)); }
.sheet h3{ font-family:var(--display); font-size:22px; margin:0 0 16px; }
.field{ margin-bottom:16px; }
.sheet .panel{ max-height:88vh; overflow-y:auto; }
.sheet h4{ font-family:var(--display); font-size:17px; margin:22px 0 10px; }
.optrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--stroke); }
.optrow p{ margin:0; font-size:14px; } .optrow small{ display:block; color:var(--muted); font-size:12.5px; }
.optrow .btn{ width:auto; flex-shrink:0; }
.bk{ width:100%; min-height:96px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(0,0,0,.3); padding:10px 12px; font-size:12px; font-family:ui-monospace,monospace; resize:vertical; margin-bottom:8px; }
.field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:8px; }
.field input[type=date]{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(0,0,0,.3); padding:0 14px; }
.row{ display:flex; gap:8px; }

.toast{ position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:50%; transform:translate(-50%,-20px); opacity:0; z-index:50; padding:11px 16px; border-radius:16px; font-size:13.5px; font-weight:600; transition:all .3s; pointer-events:none; white-space:nowrap; }
.toast.on{ transform:translate(-50%,0); opacity:1; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } #intro *{ animation:none !important; } }

/* calendário estilo check-in */
.cal-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-top h3{ margin:0; text-transform:capitalize; }
.cal-nav{ display:flex; gap:6px; }
.cal-nav button{ width:36px; height:36px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(255,255,255,.05); color:var(--text); font-size:18px; line-height:1; }
.cal-nav button:disabled{ opacity:.3; }
.cal-wk{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px; }
.cal-wk span{ text-align:center; font-size:11px; color:var(--dim); text-transform:lowercase; }
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.cd{ position:relative; width:100%; min-width:0; height:auto; aspect-ratio:1/1; border-radius:14px; border:1px solid transparent; background:rgba(255,255,255,.035); color:var(--muted); font-family:var(--display); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0; }
.cd.blank{ background:none; }
.cd.fut{ color:var(--dim); background:rgba(255,255,255,.015); }
.cd.today{ border-color:var(--stroke2); color:var(--text); }
.cd.on{ color:#0b0a12; font-weight:800; border-color:color-mix(in srgb,var(--c) 70%,#fff 30%);
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,#fff 30%),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000 30%));
  box-shadow:0 0 16px -2px var(--c), inset 0 1px 0 rgba(255,255,255,.45); animation:calpop .45s ease both; }
.cd.on.multi{ background:conic-gradient(var(--c) 0 50%, var(--c2) 50% 100%); }
.cd.sel{ outline:2px solid var(--text); outline-offset:2px; }
.cd .ball{ position:absolute; right:3px; bottom:3px; width:9px; height:9px; border-radius:50%; background:var(--cardio); box-shadow:0 0 8px var(--cardio); border:1.5px solid #0b0a12; }
.cd:not(.on) .ball{ border-color:transparent; }
@keyframes calpop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
.cal-leg{ display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:14px; font-size:12px; color:var(--muted); }
.cal-leg i{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); margin-right:6px; vertical-align:middle; }
.cal-day{ margin-top:14px; padding:14px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid var(--stroke); }
.cal-day b{ font-family:var(--display); }
.cal-day .row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; color:var(--muted); }
.cal-day .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.cal-day .acts .btn{ flex:1; }
.ballsvg{ display:block; filter:drop-shadow(0 0 4px #ffb86b) drop-shadow(0 0 7px #a98bff); }
.cd .ball{ position:absolute; right:2px; bottom:2px; width:auto; height:auto; background:none; border:0; box-shadow:none; }
.wd .fb{ position:absolute; top:-5px; right:-3px; }
.futcard{ display:flex; align-items:center; gap:14px; }
.futcard .ico{ flex-shrink:0; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:rgba(255,255,255,.04); border:1px solid var(--stroke); }
.futcard.on .ico{ border-color:color-mix(in srgb,#ffb86b 60%,transparent); background:radial-gradient(circle,rgba(255,184,107,.18),rgba(169,139,255,.08)); }
.futcard .tx{ flex:1; min-width:0; }
.futcard .tx b{ display:block; font-family:var(--display); font-size:16px; }
.futcard .tx span{ font-size:12.5px; color:var(--muted); }
.futcard .btn{ width:auto; flex-shrink:0; }
.leg-ball{ display:inline-flex; vertical-align:middle; margin-right:6px; }
/* recordes, sugestão de carga e semana */
.sug{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); background:color-mix(in srgb,var(--acc) 10%,transparent); border:1px solid color-mix(in srgb,var(--acc) 28%,transparent); border-radius:12px; padding:8px 10px; margin-bottom:10px; }
.sug b{ color:var(--text); }
.sug .tbtn{ height:30px; margin-left:auto; }
.sug.up b{ color:var(--acc); }
.prs{ margin:4px 0 14px; padding:12px 14px; border-radius:16px; text-align:left; font-size:13.5px; line-height:1.6; background:linear-gradient(135deg,rgba(255,207,92,.18),rgba(255,207,92,.04)); border:1px solid rgba(255,207,92,.45); }
.prs b{ display:block; font-size:15px; margin-bottom:2px; }
.wk-sum .stats{ margin:10px 0 0; }
.wk-sum .delta.up{ color:var(--ok); } .wk-sum .delta.down{ color:#e5484d; }
/* avaliação do treino */
.cal-ex{ list-style:none; margin:6px 0 2px; padding:0; font-size:12.5px; }
.cal-ex li{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; color:var(--muted); }
.cal-ex li span:first-child{ color:var(--text); }
.rv-in{ margin-top:12px; padding-top:12px; border-top:1px solid var(--stroke); }
.rv-t{ display:block; font-family:var(--display); font-size:15px; margin-bottom:4px; }
.stars{ display:flex; align-items:center; gap:4px; margin:4px 0 10px; }
.stars button{ font-size:32px; line-height:1; background:none; border:0; padding:2px; color:rgba(255,255,255,.18); transition:transform .15s,color .15s; }
.stars button.on{ color:#ffcf5c; text-shadow:0 0 14px rgba(255,207,92,.55); }
.stars button:active{ transform:scale(1.2); }
.stars .lbl{ margin-left:8px; font-size:13px; font-weight:700; color:var(--muted); }
.rv-wrap{ position:relative; }
.rv-ta{ width:100%; min-height:90px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(0,0,0,.28); padding:10px 58px 10px 12px; font:inherit; font-size:14px; color:var(--text); resize:vertical; margin:0 0 10px; }
.rv-ta:focus{ outline:none; border-color:var(--acc); }
.mic{ position:absolute; right:8px; bottom:18px; width:44px; height:44px; border-radius:50%; border:0; background:var(--acc); color:#0b0a12; display:grid; place-items:center; box-shadow:0 8px 18px -8px var(--acc); }
.mic svg{ width:22px; height:22px; }
.mic.on{ background:#ff3b5c; color:#fff; animation:micPulse 1.2s ease-out infinite; }
@keyframes micPulse{ from{ box-shadow:0 0 0 0 rgba(255,59,92,.6); } to{ box-shadow:0 0 0 14px rgba(255,59,92,0); } }
.mic-st{ font-size:12px; color:var(--muted); margin:-4px 0 10px; }
.cm-item{ padding:11px 12px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--stroke); margin-bottom:8px; font-size:13px; line-height:1.45; }
.cm-item .me b{ font-weight:700; }
.cm-item .st{ color:#ffcf5c; letter-spacing:1px; } .cm-item .st span{ color:rgba(255,255,255,.18); }
.cm-item .tg{ color:var(--muted); font-size:12px; }
.cm-item .rp{ margin-top:8px; color:var(--muted); }
.cm-item .rp b{ color:var(--text); }
.cm-item .rp i{ font-style:normal; }
.cm-chg{ margin-top:10px; padding:10px 12px; border-radius:12px; background:color-mix(in srgb,var(--acc) 13%,transparent); border:1px solid color-mix(in srgb,var(--acc) 35%,transparent); color:var(--text); }
.cm-chg .row{ display:flex; gap:8px; margin-top:8px; }
.cm-chg .btn{ flex:1; }
.cm-new{ border-left:4px solid var(--acc); }
/* mini player do Spotify */
.sp{ display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:12px; border-radius:22px; }
.sp .cv{ width:48px; height:48px; border-radius:12px; flex-shrink:0; background:rgba(255,255,255,.06) center/cover; display:grid; place-items:center; }
.sp .tx{ flex:1; min-width:0; }
.sp .tx b{ display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .tx span{ display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .tx i{ display:block; font-style:normal; color:#1ed760; font-size:11px; font-weight:700; letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .ctl{ display:flex; gap:4px; flex-shrink:0; }
.sp .ctl button{ width:42px; height:42px; border-radius:50%; border:1px solid var(--stroke2); background:rgba(255,255,255,.05); display:grid; place-items:center; color:var(--text); }
.sp .ctl button.pp{ background:#1ed760; border-color:#1ed760; color:#0b0a12; }
.sp .ctl svg{ width:18px; height:18px; }
/* tela de abertura */
#intro{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 38%,#2c2256 0%,#120d24 55%,#07060d 100%); transition:opacity .45s ease, visibility .45s ease; }
#intro.off{ opacity:0; visibility:hidden; pointer-events:none; }
#intro img{ width:172px; height:172px; border-radius:46px; box-shadow:0 0 70px -8px rgba(169,139,255,.75), inset 0 0 0 1px rgba(255,255,255,.12); animation:introPop .7s cubic-bezier(.2,.8,.2,1) both; }
#intro h1{ font-family:var(--display); font-weight:800; font-size:38px; letter-spacing:-.02em; margin:8px 0 0; animation:introUp .6s .15s both; }
#intro p{ margin:0; max-width:290px; color:var(--muted); font-size:15px; line-height:1.45; animation:introUp .6s .25s both; }
#intro .chip{ margin-top:6px; font-size:13px; animation:introUp .6s .35s both; }
#intro .tap{ position:absolute; bottom:calc(36px + env(safe-area-inset-bottom,0px)); color:var(--dim); font-size:13px; letter-spacing:.04em; animation:introUp .6s .6s both, tapPulse 2s 1.2s ease-in-out infinite; }
@keyframes tapPulse{ 50%{ opacity:.45; } }
@keyframes introPop{ from{ transform:scale(.7); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes introUp{ from{ transform:translateY(10px); opacity:0; } to{ transform:none; opacity:1; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="grain"></div></div>
<div id="intro" role="dialog" aria-label="Treino TH">
  <img src="icons/icon-512.png" alt="">
  <h1>Treino TH</h1>
  <p>PPL 5x + futevôlei 2x, com o joelho protegido.</p>
  <span class="chip" id="introWk" style="--c:#a98bff"></span>
  <small class="tap">Toque para começar</small>
</div>
<main id="app"></main>

<div class="timer glass" id="timer" role="status" aria-live="polite">
  <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle id="ringfg" cx="22" cy="22" r="19" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0" transform="rotate(-90 22 22)"/></svg>
  <div class="tt"><b id="tclock">1:30</b><span id="tlabel">Descanso</span></div>
  <button class="tbtn" data-act="t-15" aria-label="Menos 15 segundos">−15</button>
  <button class="tbtn" data-act="t+15" aria-label="Mais 15 segundos">+15</button>
  <button class="tbtn" data-act="tskip">Pular</button>
</div>

<nav class="tabs"><div class="in glass" id="tabs"></div></nav>
<div class="sheet" id="sheet"></div>
<div class="toast glass" id="toast"></div>

<script>
/* ---------- plano ---------- */
const TYPES = { push:{c:'#ffb86b',label:'Push'}, pull:{c:'#a98bff',label:'Pull'}, legs:{c:'#ff6f91',label:'Legs'}, cardio:{c:'#4fe3c1',label:'Cardio'}, rest:{c:'#7d7a95',label:'Descanso'} };
const YT = id => 'https://www.youtube.com/watch?v=' + id;
const PLAN = {
  seg:{ type:'push', title:'Peito, ombros e tríceps', note:'Peito pesado primeiro, com o músculo descansado. Cerca de 60 min.', ex:[
    {id:'supino-reto', name:'Supino reto (barra ou halteres)', obs:'Desça em 3 segundos, suba explosivo.', yt:'8UiTPNj66AU', sets:4, reps:'8–10', rest:120},
    {id:'supino-incl-halter', name:'Supino inclinado com halteres', obs:'Ênfase na porção superior do peitoral.', yt:'DbFgADa2PL8', sets:3, reps:'10–12', rest:90},
    {id:'desenv-halter', name:'Desenvolvimento com halteres', obs:'Costas encostadas no banco, sem compensar a lombar.', yt:'eufDL9MmF8A', sets:4, reps:'10', rest:90},
    {id:'elev-lateral', name:'Elevação lateral com halteres', obs:'Carga leve, controle total, cotovelo levemente flexionado.', yt:'3VcKaXpzqRo', sets:4, reps:'15', rest:60},
    {id:'crucifixo', name:'Crucifixo com halteres ou crossover', obs:'Amplitude máxima, carga leve.', yt:'ZjIKUMtW37c', sets:3, reps:'12', rest:60},
    {id:'triceps-corda', name:'Tríceps corda (polia alta)', obs:'Cotovelo fixo ao lado do corpo.', yt:'2-LAMcpzODU', sets:3, reps:'12', rest:60},
    {id:'triceps-testa', name:'Tríceps testa com barra EZ', obs:'Controle na descida, cuidado com o cotovelo.', yt:'d_KZxkY_0cM', sets:3, reps:'12', rest:60}
  ]},
  ter:{ type:'pull', futev:true, title:'Costas e bíceps', note:'Musculação primeiro, futevôlei pelo menos 4 a 6 horas depois.', ex:[
    {id:'puxada-frontal', name:'Puxada frontal (pulley)', obs:'Amplitude completa, cotovelo desce até o quadril.', yt:'BOW9my4J_ek', sets:4, reps:'10', rest:90},
    {id:'remada-curvada', name:'Remada curvada com barra', obs:'Costas neutras, cotovelo puxando para o quadril.', yt:'5JJPn3yBDFw', sets:4, reps:'10', rest:120},
    {id:'remada-unilateral', name:'Remada unilateral com halter', obs:'Apoio no banco, amplitude longa.', yt:'pYcpY20QaE8', sets:3, reps:'12', rest:75},
    {id:'pullover', name:'Pullover com halter', obs:'Fecha o volume de dorsal.', yt:'FK4rHfGhSQI', sets:3, reps:'12', rest:60},
    {id:'face-pull', name:'Face pull (polia alta com corda)', obs:'Puxe até a altura do rosto, cotovelos altos.', yt:'rep-qVOkqgk', sets:3, reps:'15', rest:60},
    {id:'rosca-direta', name:'Rosca direta com barra EZ ou halteres', obs:'Sem balanço de corpo, cotovelo fixo.', yt:'ykJmrZ5v0Oo', sets:3, reps:'12', rest:60},
    {id:'rosca-martelo', name:'Rosca martelo', obs:'Pegada neutra.', yt:'TwD-YGVP4Bk', sets:3, reps:'12', rest:60}
  ]},
  qua:{ type:'legs', title:'Pernas e protocolo do joelho', note:'O treino mais importante da semana para o seu quadro. Não reduza a intensidade aqui.', ex:[
    {id:'bike-aquec', kind:'time', name:'Aquecimento na bike', obs:'Ritmo leve, sem resistência.', sets:1, reps:'5 min', rest:30},
    {id:'leg-press', name:'Leg press 45°', obs:'Pés na altura do joelho, sem travar no topo.', yt:'IZxyjW7MPJQ', sets:4, reps:'12', rest:120},
    {id:'goblet', name:'Agachamento goblet', obs:'Joelho alinhado com o 2º dedo do pé.', yt:'MxsFDhcyFyE', sets:3, reps:'10', rest:90},
    {id:'excentrico', star:true, name:'Extensão excêntrica declinada', obs:'Desça em 4 a 5 segundos, suba com as duas pernas. Dor aguda: pare.', yt:'_Rv7YnWFCjQ', sets:3, reps:'8 lentas', rest:90},
    {id:'extensora', name:'Cadeira extensora (30° a 90°)', obs:'Evite os extremos do movimento.', yt:'YyvSfVjQeL0', sets:3, reps:'12', rest:60},
    {id:'flexora', name:'Flexora deitada', obs:'Isquiotibiais fortes protegem o joelho.', yt:'ELOCsoDSmrg', sets:3, reps:'12', rest:60},
    {id:'hip-thrust', name:'Hip thrust com barra', obs:'Quadril sobe até ficar paralelo ao chão.', yt:'OUgsJ8-Vi0E', sets:4, reps:'15', rest:90},
    {id:'abducao', name:'Abdução de quadril', obs:'Estabilização lateral do joelho.', yt:'kDqklk4OMBE', sets:3, reps:'15', rest:60}
  ]},
  qui:{ type:'push', futev:true, title:'Peito, ombros e tríceps', note:'Segunda sessão de Push, começando pelo inclinado. Futevôlei depois, com intervalo.', ex:[
    {id:'supino-incl-barra', name:'Supino inclinado com barra', obs:'Hoje a ordem inverte: inclinado primeiro.', yt:'DbFgADa2PL8', sets:4, reps:'10', rest:120},
    {id:'supino-reto-halter', name:'Supino reto com halteres', obs:'Mais amplitude que a barra, controle na descida.', yt:'8UiTPNj66AU', sets:3, reps:'12', rest:90},
    {id:'arnold', name:'Desenvolvimento Arnold', obs:'Rotação no movimento.', yt:'6Z15_WdXmVw', sets:4, reps:'10', rest:90},
    {id:'elev-frontal', name:'Elevação frontal', obs:'Braço sobe até a altura do ombro.', yt:'gkCwMgEJBEY', sets:3, reps:'12', rest:60},
    {id:'crossover', name:'Crossover (polia alta)', obs:'Contração máxima no centro, carga leve.', yt:'ZjIKUMtW37c', sets:3, reps:'15', rest:60},
    {id:'triceps-frances', name:'Tríceps francês com halter', obs:'Cotovelo apontando para o teto.', yt:'d_KZxkY_0cM', sets:3, reps:'12', rest:60},
    {id:'triceps-corda', name:'Tríceps corda (polia alta)', obs:'Abra as mãos na extensão total.', yt:'2-LAMcpzODU', sets:3, reps:'15', rest:60}
  ]},
  sex:{ type:'pull', title:'Costas, bíceps e manutenção do joelho', note:'A manutenção do joelho no final leva 10 minutos. Não pule.', ex:[
    {id:'puxada-pronada', name:'Puxada pronada (pegada larga)', obs:'Pegada diferente da terça.', yt:'BOW9my4J_ek', sets:4, reps:'10', rest:90},
    {id:'remada-cavalinho', name:'Remada cavalinho (máquina)', obs:'Mais estável, aceita carga mais alta.', yt:'GZbfZ033f74', sets:4, reps:'10', rest:120},
    {id:'puxada-supinada', name:'Puxada supinada (pegada fechada)', obs:'Mais ativação de bíceps.', yt:'BOW9my4J_ek', sets:3, reps:'12', rest:90},
    {id:'face-pull', name:'Face pull', obs:'Saúde do manguito rotador.', yt:'rep-qVOkqgk', sets:3, reps:'15', rest:60},
    {id:'rosca-concentrada', name:'Rosca concentrada com halter', obs:'Cotovelo apoiado no joelho.', yt:'Jvj2wV0vOYU', sets:3, reps:'12', rest:60},
    {id:'rosca-martelo', name:'Rosca martelo alternada', obs:'Finalização de bíceps.', yt:'TwD-YGVP4Bk', sets:3, reps:'12', rest:60},
    {id:'excentrico', star:true, name:'Extensão excêntrica declinada (manutenção)', obs:'Com peso corporal, descida lenta.', yt:'_Rv7YnWFCjQ', sets:2, reps:'8 lentas', rest:90},
    {id:'prancha', kind:'time', name:'Prancha isométrica', obs:'Core firme, quadril alinhado.', yt:'pSHjTRCQxIw', sets:3, reps:'45s', rest:45}
  ]},
  sab:{ type:'cardio', title:'Bike ou elíptico', note:'Opcional. Se o joelho piorou na semana, troque por alongamento e mobilidade.', ex:[
    {id:'bike-leve', kind:'time', name:'Bike ergométrica ou elíptico', obs:'Ritmo moderado, frequência entre 120 e 140 bpm.', sets:1, reps:'25–35 min', rest:0}
  ]},
  dom:{ type:'rest', title:'Descanso', note:'Recuperação faz parte do treino. Sono de 7 a 8 horas.', ex:[] }
};
const DAYS = ['seg','ter','qua','qui','sex','sab','dom'];
const DLABEL = {seg:'Seg',ter:'Ter',qua:'Qua',qui:'Qui',sex:'Sex',sab:'Sáb',dom:'Dom'};
const DFULL = {seg:'Segunda',ter:'Terça',qua:'Quarta',qui:'Quinta',sex:'Sexta',sab:'Sábado',dom:'Domingo'};
// descanso: 60s nos exercícios pesados, 45s no restante
DAYS.forEach(d => PLAN[d].ex.forEach(e => { if(e.rest) e.rest = e.rest >= 90 ? 60 : 45; }));

/* ---------- utilidades ---------- */
const z = n => String(n).padStart(2,'0');
const ymd = (d = new Date()) => d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a, b) => Math.round((parseYmd(ymd(a)) - parseYmd(ymd(b))) / 864e5);
const todayKey = () => DAYS[(new Date().getDay()+6)%7];
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtNum = n => (Math.round(n*10)/10).toLocaleString('pt-BR');
const fmtDate = s => parseYmd(s).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.', '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstNum = s => parseInt(String(s), 10) || '';
const painColor = v => v <= 3 ? '#4fe3c1' : v <= 6 ? '#ffcf5c' : '#ff5f7e';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

};

};

const LS = 'treino-hibrido-v1';

/* ---------- lógica ---------- */
const blankSets = ex => Array.from({length:ex.sets}, () => ({w:'', r:'', done:false}));
function draft(day){
  let d = S.drafts[day];
  if(!d || d.date !== ymd()){ d = S.drafts[day] = { date:ymd(), log:{}, pain:null, startedAt:null }; }
  if(!d.wt) d.wt = {};
  return d;
}
function exSets(d, ex){ if(!d.log[ex.id] || d.log[ex.id].length !== ex.sets) d.log[ex.id] = blankSets(ex); return d.log[ex.id]; }
const exDone = (d, ex) => { const s = d.log[ex.id]; return !!s && s.length === ex.sets && s.every(x => x.done); };
const sessionsDesc = () => [...S.sessions].sort((a,b) => b.finishedAt - a.finishedAt);
function lastFor(exId){ for(const s of sessionsDesc()){ const v = s.log && s.log[exId]; if(v && v.length) return v; } return null; }
const todaySession = day => sessionsDesc().find(s => s.date === ymd() && s.day === day);

function cycleInfo(){
  const P = S.program, start = parseYmd(P.start), total = P.weeks * 7;
  const elapsed = Math.max(0, Math.min(total, dayDiff(new Date(), start) + 1));
  const end = addDays(start, total);
  const inCycle = S.sessions.filter(s => { const d = parseYmd(s.date); return d >= start && d < end; });
  const planned = P.weeks * 6;
  return { week: Math.max(1, Math.min(P.weeks, Math.ceil(elapsed / 7) || 1)), weeks:P.weeks, elapsed, total, daysLeft: total - elapsed, done: inCycle.length + (P.prior || 0), planned, inCycle, ended: dayDiff(new Date(), start) >= total, notStarted: dayDiff(new Date(), start) < 0 };
}
function weekState(){
  const mon = mondayOf(new Date());
  return DAYS.map((k, i) => {
    const date = ymd(addDays(mon, i));
    const done = S.sessions.some(s => s.date === date && s.day === k);
    const dr = S.drafts[k];
    const part = !done && dr && dr.date === date && Object.values(dr.log).some(a => a.some(x => x.done));
    return { k, done, part, today: date === ymd() };
  });
}

/* ---------- gráfico ---------- */
let gid = 0;
function chart(pts, color, opt = {}){
  const W = 320, H = 160, p = {l:30, r:14, t:16, b:26};
  const ys = pts.map(q => q.y);
  let mn = opt.min ?? Math.min(...ys), mx = opt.max ?? Math.max(...ys);
  if(mn === mx){ mn -= 1; mx += 1; }
  const x = i => pts.length === 1 ? (p.l + (W-p.l-p.r)/2) : p.l + i*(W-p.l-p.r)/(pts.length-1);
  const y = v => p.t + (mx - v)*(H-p.t-p.b)/(mx - mn);
  const id = 'g' + (++gid);
  const line = pts.map((q,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q.y).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-p.b) + ' L' + x(0).toFixed(1) + ' ' + (H-p.b) + ' Z';
  const grid = [mn, (mn+mx)/2, mx].map(v => `<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#6c6884">${fmtNum(v)}</text>`).join('');
  const dots = pts.map((q,i) => `<circle cx="${x(i)}" cy="${y(q.y)}" r="${pts.length > 20 ? 2.5 : 4}" fill="${q.c || color}" stroke="#07060d" stroke-width="1.5"/>`).join('');
  const labs = pts.length ? `<text x="${x(0)}" y="${H-6}" font-size="10" fill="#6c6884" text-anchor="${pts.length===1?'middle':'start'}">${esc(pts[0].lab)}</text>` + (pts.length > 1 ? `<text x="${x(pts.length-1)}" y="${H-6}" font-size="10" fill="#6c6884" text-anchor="end">${esc(pts[pts.length-1].lab)}</text>` : '') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Gráfico')}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>
    <filter id="${id}f" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${grid}${pts.length > 1 ? `<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" filter="url(#${id}f)"/>` : ''}${dots}${labs}</svg>`;
}

/* ---------- render ---------- */
const $app = document.getElementById('app');
function setAcc(){
  let c = TYPES[PLAN[S.day].type].c;
  if(S.tab === 'progresso') c = TYPES.cardio.c;
  if(S.tab === 'joelho') c = TYPES.legs.c;
  if(S.tab === 'guia') c = TYPES.push.c;
  document.documentElement.style.setProperty('--acc', c);
}
function render(){
  setAcc();
  const ci = cycleInfo();
  const pct = Math.min(100, Math.round(ci.done / ci.planned * 100));

  let html = `

      <div class="brand"><img src="icons/icon-192.png" alt="">Treino TH</div>

    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Treinos concluídos no ciclo"><i style="width:${pct}%"></i></div>
    <div class="bar time" aria-hidden="true"><i style="width:${tpct}%"></i></div>
    <div class="legend"><span>${fmtDate(S.program.start)}</span><span>${pct}% concluído</span><span>${fmtDate(ymd(addDays(parseYmd(S.program.start), ci.total - 1)))}</span></div>
    ${ci.ended ? `<div class="cycle-done"><span>Hora de trocar o treino. Seu ciclo de ${ci.weeks} semanas terminou.</span><button class="btn sm ghost" data-act="settings">Novo ciclo</button></div>` : ''}
  </section>`;
  if(S.tab === 'treino'){
    html += `<div class="week" role="tablist" aria-label="Dias da semana">` + weekState().map(w => {
      const c = TYPES[PLAN[w.k].type].c, rest = w.k === 'dom';
      return `<button class="wd ${w.k===S.day?'sel':''} ${w.today?'today':''} ${w.done?'done':''} ${w.part?'part':''} ${rest?'off':''}" style="--c:${c}" data-act="day" data-day="${w.k}" role="tab" aria-selected="${w.k===S.day}" aria-label="${DFULL[w.k]}${w.done?', concluído':''}"><div class="l">${DLABEL[w.k]}</div>${hasFut(dateOfDay(w.k)) ? `<i class="fb">${BALL(13)}</i>` : ''}<div class="s">${w.done?ICON.check.replace('stroke-width="3"','stroke-width="3.5" width="12" height="12"'):''}</div></button>`;
    }).join('') + `</div>` + installCard() + cmCard() + spCard() + viewTreino();
  }
  if(S.tab === 'progresso') html += viewProgresso(ci);
  if(S.tab === 'joelho') html += viewJoelho();
  if(S.tab === 'guia') html += viewGuia();
  $app.innerHTML = html;
  renderTabs();
}

const dateOfDay = k => ymd(addDays(mondayOf(new Date()), DAYS.indexOf(k)));
const hasFut = date => futDates().has(date);
function futCard(day){
  let date = dateOfDay(day);
  if(date > ymd()) date = ymd(addDays(parseYmd(date), -7));
  const isToday = date === ymd(), on = (S.program.fut || []).includes(date), auto = !on && hasFut(date);
  const when = isToday ? 'hoje' : fmtDate(date);
  return `<section class="card glass futcard ${on||auto?'on':''}"><div class="ico">${BALL(30)}</div>
    <div class="tx"><b>${on||auto ? 'Futevôlei registrado' : 'Treinou futevôlei?'}</b><span>${on||auto ? `Bolinha no calendário · ${when}` : `Marque para o calendário · ${when}`}</span></div>
    ${auto ? '' : `<button class="btn sm ${on?'ghost':''}" data-act="futtoggle" data-date="${date}">${on ? 'Desfazer' : 'Treinei'}</button>`}</section>`;
}
function viewTreino(){
  const day = S.day, plan = PLAN[day], T = TYPES[plan.type];
  const chips = `<div class="chips"><span class="chip" style="--c:${T.c}">${T.label}</span>${plan.futev ? `<span class="chip" style="--c:#4fe3c1">+ Futevôlei</span>` : ''}<span class="chip" style="--c:#a6a2bd">${DFULL[day]}</span></div>`;
  if(!plan.ex.length){
    return `<section class="day-head glass">${chips}<h2>${plan.title}</h2><p>${plan.note}</p></section>${futCard(day)}
    <section class="card glass"><h3>Dia livre</h3><p class="hint">Se jogou futevôlei ou sentiu o joelho, registre a dor para acompanhar a evolução.</p><button class="btn ghost" data-act="tab" data-tab="joelho">Registrar dor do joelho</button></section>`;
  }
  const done = todaySession(day);
  if(done && !S.redo){
    const mins = done.startedAt ? Math.max(1, Math.round((done.finishedAt - done.startedAt)/60000)) : null;
    return `<section class="day-head glass">${chips}<h2>${plan.title}</h2></section>
    <section class="donecard glass"><div class="big">${ICON.check}</div><h2>Treino concluído</h2><p class="hint" style="color:var(--muted);margin:0">${DFULL[day]}, ${fmtDate(done.date)}</p>
      <div class="stats"><div class="stat"><b>${done.sets}</b><span>séries</span></div><div class="stat"><b>${fmtNum(done.volume)}</b><span>kg de volume</span></div><div class="stat"><b>${mins ? mins + 'min' : '—'}</b><span>duração</span></div></div>
      ${plan.futev ? `<button class="btn" data-act="tab" data-tab="joelho" style="margin-bottom:8px">Registrar dor pós-futevôlei</button>` : ''}
      ${prList(done)}<button class="btn ghost" data-act="redo">Registrar outro treino hoje</button></section>${rvCard()}${futCard(day)}`;
  }
  const d = draft(day);
  const total = plan.ex.length, doneCount = plan.ex.filter(e => exDone(d, e)).length;
  const curIdx = plan.ex.findIndex(e => !exDone(d, e));
  if(S.open[day] === undefined) S.open[day] = curIdx === -1 ? null : plan.ex[curIdx].id;
  const anyDone = Object.values(d.log).some(a => a.some(x => x.done));
  let h = `<section class="day-head glass">${chips}<h2>${plan.title}</h2><p>${plan.note}</p>
    <div class="steps"><div class="steps-top"><b>${doneCount === total ? 'Tudo concluído' : `Etapa ${Math.min(doneCount+1,total)} de ${total}`}</b><span>${Math.round(doneCount/total*100)}%</span></div>
    <div class="segs">${plan.ex.map((e,i) => `<div class="seg ${exDone(d,e)?'on':''} ${i===curIdx?'cur':''}"></div>`).join('')}</div></div></section>${futCard(day)}`;
  plan.ex.forEach((ex, i) => {
    const sets = exSets(d, ex), complete = exDone(d, ex), open = S.open[day] === ex.id;
    const doneSets = sets.filter(s => s.done).length;
    const last = lastFor(ex.id);
    const best = last && ex.kind !== 'time' ? last.reduce((a,b) => (b.w > a.w || (b.w === a.w && b.r > a.r)) ? b : a) : null;
    h += `<article class="ex glass ${complete?'complete':''} ${open?'open':''}">
      <button class="ex-h" data-act="open" data-ex="${ex.id}" aria-expanded="${open}">
        <span class="ex-st">${complete ? ICON.check.replace('<svg','<svg width="15" height="15"') : i+1}</span>
        <span class="ex-t"><div class="n">${ex.star ? '★ ' : ''}${esc(ex.name)}</div><div class="m">${ex.sets} × ${ex.reps}${doneSets && !complete ? ` · ${doneSets}/${ex.sets} feitas` : ''}</div><span class="hbar" aria-hidden="true"><i style="width:${Math.round(doneSets/ex.sets*100)}%"></i></span></span>
        <span class="chev">▼</span>
      </button>
      <div class="ex-b">
        <p class="obs">${esc(ex.obs)}</p>
        ${best ? `<div class="last">Última vez: <em>${best.w ? fmtNum(best.w) + ' kg × ' : ''}${best.r} reps</em></div>` : ''}
        ${sugHtml(ex, d)}
        ${ex.kind !== 'time' ? `<div class="wrow"><span class="lbl">Carga<small>Vale para todas as séries</small></span><label class="fld"><input inputmode="decimal" data-k="w" data-ex="${ex.id}" value="${esc(d.wt[ex.id] ?? '')}" placeholder="${best && best.w ? fmtNum(best.w) : '0'}" aria-label="Carga do exercício em kg"><span>kg</span></label></div>` : ''}
        <div class="sprog"><div class="sprog-top"><span>${ex.sets} × ${esc(ex.reps)}</span><b>${doneSets} de ${ex.sets} séries</b></div>
          <div class="sbar" role="progressbar" aria-valuenow="${doneSets}" aria-valuemin="0" aria-valuemax="${ex.sets}" aria-label="Séries concluídas">${sets.map(s => `<i class="${s.done?'on':''}"></i>`).join('')}</div></div>
        <div class="srow">
          ${complete ? `<button class="btn ok" disabled>${ICON.check}Exercício concluído</button>` : `<button class="btn" data-act="nextset" data-ex="${ex.id}">${ICON.check}Concluir série ${doneSets+1} de ${ex.sets}</button>`}
          ${doneSets ? `<button class="tbtn undo" data-act="undoset" data-ex="${ex.id}">Desfazer</button>` : ''}
        </div>
        ${ex.yt ? `<a class="yt" href="${YT(ex.yt)}" target="_blank" rel="noopener">▶ Ver execução</a>` : ''}
      </div></article>`;
  });
  const pv = d.pain;
  h += `<section class="card glass" style="margin-top:14px"><h3>Joelho hoje</h3><p class="hint">Opcional. Ajuda a acompanhar o tendão ao longo do ciclo.</p>
    <div class="pain-val" style="--pc:${pv==null?'var(--dim)':painColor(pv)}"><b>${pv==null?'–':pv}</b><span>${pv==null?'Arraste para registrar':'de 10'}</span></div>
    <input type="range" min="0" max="10" step="1" value="${pv==null?0:pv}" data-k="pain" aria-label="Dor no joelho de 0 a 10"><div class="scale"><span>Sem dor</span><span>Dor forte</span></div></section>
    <button class="btn" data-act="finish" ${anyDone?'':'disabled'}>${doneCount === total ? 'Concluir treino' : anyDone ? `Concluir com ${doneCount} de ${total} exercícios` : 'Marque uma série para concluir'}</button>` + (S.day === todayKey() ? rvCard() : '');
  return h;
}


/* ---------- calendário de check-ins ---------- */
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DAY_BY_JS = ['dom','seg','ter','qua','qui','sex','sab'];
const futDates = () => { const set = new Set(S.program.fut || []); S.pain.forEach(p => { if(p.ctx === 'Futevôlei') set.add(p.date); }); return set; };
function checkinStats(){
  const dates = new Set(S.sessions.map(s => s.date)), fut = futDates();
  fut.forEach(d => dates.add(d));
  const mins = S.sessions.reduce((a,s) => a + (s.startedAt && s.finishedAt ? Math.min(240, (s.finishedAt - s.startedAt)/60000) : 0), 0);
  // sequência de semanas com 4+ check-ins (contando a atual se já bateu ou ainda está em andamento)
  let streak = 0, cur = 0;
  const mon = mondayOf(new Date());
  for(let w = 0; w < 104; w++){
    const m = addDays(mon, -7*w); let n = 0;
    for(let i = 0; i < 7; i++) if(dates.has(ymd(addDays(m, i)))) n++;
    if(w === 0){ cur = n; if(n >= 4) streak++; continue; }
    if(n >= 4) streak++; else break;
  }
  return { checkins: S.sessions.length + fut.size, days: dates.size, mins: Math.round(mins), streak, cur };
}
function viewCalendar(){

}

const TM = { end:0, total:0, int:null, next:'', lastSec:-1 };
let actx = null, amaster = null;
// cadeia de áudio: tudo passa por ganho alto + compressor (soa bem mais alto sem estourar)
function unlockAudio(){
  try{
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = .001; comp.release.value = .08;
      amaster = actx.createGain(); amaster.gain.value = 2.2;
      amaster.connect(comp); comp.connect(actx.destination);
    }
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function tone(f, t, dur, vol = 1, type = 'square'){
  const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(amaster);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01);
  g.gain.setValueAtTime(vol, t0 + dur - .03); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + .02);
}
// bipe curto da contagem 3, 2, 1
function countBeep(){ try{ if(actx){ unlockAudio(); tone(1046, 0, .12, .7); } }catch(e){} try{ navigator.vibrate && navigator.vibrate(90); }catch(e){} }
// alarme do fim do descanso: 3 pares de bipes agudos
function beep(){
  try{ if(actx){ unlockAudio(); for(let i = 0; i < 3; i++){ tone(1318, i*.45, .16, 1); tone(1760, i*.45 + .18, .2, 1); } } }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([400,120,400,120,700]); }catch(e){}
}
const PWA = ('serviceWorker' in navigator) && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
const notifOk = () => PWA && ('Notification' in window) && Notification.permission === 'granted';
function notifState(){
  if(!('Notification' in window)) return 'Não suportado neste navegador';
  if(Notification.permission === 'granted') return 'Ativado. Toca mesmo com a tela bloqueada.';
  if(Notification.permission === 'denied') return 'Bloqueado. Libere em Configurações → Apps → Treino TH → Notificações.';
  return 'Notifica quando o descanso acabar, mesmo com a tela bloqueada';
}
// o aviso com tela bloqueada é mostrado pelo service worker (sw.js), que segura o horário mesmo se a página congelar
async function swPost(msg){
  try{
    if(!PWA) return false;
    const reg = await navigator.serviceWorker.getRegistration();
    const sw = reg && (reg.active || reg.waiting || reg.installing);
    if(sw){ sw.postMessage(msg); return true; }
  }catch(e){}
  return false;
}
function scheduleRest(){ if(notifOk()) swPost({ type:'rest', end:TM.end, total:TM.total, next:TM.next }); }
// botões da notificação (+15 s / Pular) mexem no timer do app
if(PWA) navigator.serviceWorker.addEventListener('message', e => {
  const d = e.data || {};
  if(d.type === 'rest-sync'){ TM.end = d.end; TM.total = Math.max(TM.total, d.total || 0); if(!TM.int) TM.int = setInterval(tick, 200); tick(); }
  if(d.type === 'rest-skip'){ clearInterval(TM.int); TM.int = null; document.getElementById('timer').classList.remove('on','end','warn'); }
});
function cancelRest(){ swPost({ type:'rest-cancel' }); }
function askNotifOnce(){
  try{

  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',

  note:'<svg viewBox="0 0 24 24" fill="#1ed760" width="22" height="22"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5l11-2v11.5a2.5 2.5 0 1 1-2-2.45V7.1l-7 1.3z"/></svg>'

function spLoad(){ try{ SP.tok = JSON.parse(localStorage.getItem('treino-sp') || 'null'); }catch(e){ SP.tok = null; } }

async function spConnect(){
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  localStorage.setItem('treino-sp-pkce', JSON.stringify({ v, st }));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id:SPOTIFY_ID, response_type:'code', redirect_uri:SP_REDIRECT, code_challenge_method:'S256', code_challenge:ch, scope:SP_SCOPES, state:st });
}
async function spToken(params){
  const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:new URLSearchParams({ client_id:SPOTIFY_ID, ...params }) });
  if(!r.ok) throw new Error('token ' + r.status);
  const j = await r.json();

// volta do login do Spotify: troca o código pelo token e limpa a URL
async function spHandleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has('code') && !q.has('error')) return false;
  let pk = null; try{ pk = JSON.parse(localStorage.getItem('treino-sp-pkce') || 'null'); }catch(e){}
  localStorage.removeItem('treino-sp-pkce');
  history.replaceState(null, '', SP_REDIRECT);
  if(q.has('error') || !pk || q.get('state') !== pk.st){ toast('Spotify não conectado'); return true; }
  try{ await spToken({ grant_type:'authorization_code', code:q.get('code'), redirect_uri:SP_REDIRECT, code_verifier:pk.v }); toast('Spotify conectado 🎵'); render(); spStart(); }
  catch(e){ toast('Não deu pra conectar o Spotify'); }
  return true;
}
async function spFetch(path, opt = {}, retry = true){
  if(!SP.tok) return null;
  if(Date.now() > SP.tok.exp){
    try{ await spToken({ grant_type:'refresh_token', refresh_token:SP.tok.refresh }); }
    catch(e){ SP.tok = null; spSave(); render(); toast('Conecte o Spotify de novo nos Ajustes'); return null; }
  }
  const r = await fetch('https://api.spotify.com/v1' + path, { ...opt, headers:{ Authorization:'Bearer ' + SP.tok.access, ...(opt.body ? { 'Content-Type':'application/json' } : {}) } });
  if(r.status === 401 && retry){ SP.tok.exp = 0; return spFetch(path, opt, false); }
  return r;
}
async function spPoll(){

function spInner(){
  const n = SP.now;
  if(!n) return `<div class="cv">${SPI.note}</div><div class="tx"><i>SPOTIFY</i><b>Carregando…</b></div>`;
  if(n.idle) return `<div class="cv">${SPI.note}</div><div class="tx"><i>SPOTIFY</i><b>Nada tocando</b><span>Toque ▶ para continuar de onde parou</span></div>
    <div class="ctl"><button class="pp" data-act="sp-play" aria-label="Tocar">${SPI.play}</button></div>`;
  return `<div class="cv" style="${n.img ? `background-image:url('${esc(n.img)}')` : ''}">${n.img ? '' : SPI.note}</div>
    <div class="tx"><i>SPOTIFY${n.device ? ' · ' + esc(n.device) : ''}</i><b>${esc(n.title)}</b><span>${esc(n.artist)}</span></div>
    <div class="ctl"><button data-act="sp-prev" aria-label="Música anterior">${SPI.prev}</button><button class="pp" data-act="${n.playing ? 'sp-pause' : 'sp-play'}" aria-label="${n.playing ? 'Pausar' : 'Tocar'}">${n.playing ? SPI.pause : SPI.play}</button><button data-act="sp-next" aria-label="Próxima música">${SPI.next}</button></div>`;
}
function spCard(){ return spEnabled() && SP.tok ? `<section class="sp glass" id="spcard" aria-label="Spotify">${spInner()}</section>` : ''; }
function spPaint(){ const el = document.getElementById('spcard'); if(el) el.innerHTML = spInner(); }
// sem aparelho ativo: acorda o Spotify do celular (ou o primeiro disponível)
async function spWake(){
  const r = await spFetch('/me/player/devices'); if(!r || !r.ok) return false;
  const ds = (await r.json()).devices || [];
  const d = ds.find(x => x.type === 'Smartphone') || ds[0];
  if(!d){ toast('Abra o Spotify no celular e toque uma música uma vez'); return false; }
  await spFetch('/me/player', { method:'PUT', body:JSON.stringify({ device_ids:[d.id], play:true }) });
  return true;
}
async function spCmd(act){
  const map = { 'sp-play':['PUT','/me/player/play'], 'sp-pause':['PUT','/me/player/pause'], 'sp-next':['POST','/me/player/next'], 'sp-prev':['POST','/me/player/previous'] };
  const [method, path] = map[act];
  if(SP.now && !SP.now.idle && (act === 'sp-play' || act === 'sp-pause')){ SP.now.playing = act === 'sp-play'; spPaint(); }
  try{
    const r = await spFetch(path, { method });
    if(r && r.status === 404){ await spWake(); }
    else if(r && r.status === 403){ toast('O Spotify recusou: precisa do Premium'); }
  }catch(e){ toast('Spotify não respondeu'); }
  setTimeout(spPoll, 500);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && SP.tok) spPoll(); });

/* ---------- avaliação do treino ----------
   Ele avalia o treino (estrelas + comentários/dúvidas, por texto ou voz) → o servidor responde na hora com a IA grátis
   do Cloudflare → às 22h o Claude revisa, responde e pode propor mudança no plano, que ele aprova aqui. */
function myUid(){
  let u = localStorage.getItem('treino-uid');
  if(!u || !/^[a-z0-9]{12,40}$/.test(u)){ u = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 32); localStorage.setItem('treino-uid', u); }
  return u;
}
function cmLoad(){ try{ S.notes = JSON.parse(localStorage.getItem('treino-notes') || '[]'); }catch(e){ S.notes = []; } try{ S.cmSeen = new Set(JSON.parse(localStorage.getItem('treino-notes-seen') || '[]')); }catch(e){ S.cmSeen = new Set(); } }
function cmSave(){ try{ localStorage.setItem('treino-notes', JSON.stringify(S.notes.slice(-200))); localStorage.setItem('treino-notes-seen', JSON.stringify([...S.cmSeen].slice(-400))); }catch(e){} }
const cmTyping = () => document.activeElement && document.activeElement.tagName === 'TEXTAREA';
async function cmFetch(){
  if(!navigator.onLine) return;
  try{ const r = await api('/notes', { uid:myUid() }); const before = JSON.stringify(S.notes); S.notes = r.notes || []; cmSave(); if(JSON.stringify(S.notes) !== before && !cmTyping()) render(); }catch(e){}
}
function cmItem(n){
  let h = `<div class="cm-item ${n.claude && !S.cmSeen.has(n.id) ? 'cm-new' : ''}"><div class="me"><b>Você · ${fmtDate(n.date)}</b>${n.rating ? ` <span class="st" aria-label="${n.rating} de 5 estrelas">${'★'.repeat(n.rating)}<span>${'★'.repeat(5 - n.rating)}</span></span>` : ''}${n.text ? '<br>' + esc(n.text) : ''}</div>`;
  if(n.ai) h += `<div class="rp"><b>Resposta rápida:</b> ${esc(n.ai.text)}</div>`;
  h += n.claude ? `<div class="rp"><b>Claude:</b> ${esc(n.claude.text)}</div>` : `<div class="rp"><i>🌙 O Claude revisa com calma às 22h.</i></div>`;
  const c = n.change;
  if(c){
    if(c.status === 'proposta') h += `<div class="cm-chg"><b>Sugestão de mudança no treino:</b> ${esc(c.summary)}${c.detail ? '<br><span class="tg">' + esc(c.detail) + '</span>' : ''}<div class="row"><button class="btn sm" data-act="cm-yes" data-id="${n.id}">Aplicar essa mudança</button><button class="btn sm ghost" data-act="cm-no" data-id="${n.id}">Agora não</button></div></div>`;
    else if(c.status === 'aprovada') h += `<div class="cm-chg">✅ Você aprovou: <b>${esc(c.summary)}</b>. O Claude aplica no seu treino na próxima revisão.</div>`;
    else if(c.status === 'aplicada') h += `<div class="cm-chg">✅ Aplicado no seu treino: <b>${esc(c.summary)}</b>${c.note ? '<br><span class="tg">' + esc(c.note) + '</span>' : ''}</div>`;
    else if(c.status === 'recusada') h += `<div class="rp"><i>Você preferiu manter como está.</i></div>`;
  }
  return h + `</div>`;
}
function rvCard(dayKey = S.day, date = ymd(), embed = false){
  const plan = PLAN[dayKey], key = 'treino-' + dayKey;
  const mine = (S.notes || []).filter(n => n.ex === key && (!embed || n.date === date)).slice(-2).reverse();
  const sent = mine.some(n => n.date === date), st = S.rvStars || 0;
  let h = embed ? `<div class="rv rv-in"><b class="rv-t">⭐ Avaliar este treino</b>` : `<section class="card glass rv"><h3>⭐ Avaliar treino</h3>`;
  if(!sent || S.rvAgain === date){
    h += `<p class="hint">Como foi o ${esc(TYPES[plan.type].label)} ${date === ymd() ? 'de hoje' : 'de ' + fmtDate(date)}? Dê uma nota e deixe seus comentários ou dúvidas.</p>
    <div class="stars" role="radiogroup" aria-label="Nota do treino">${[1,2,3,4,5].map(v => `<button data-act="rv-star" data-v="${v}" class="${v <= st ? 'on' : ''}" role="radio" aria-checked="${v === st}" aria-label="${v} ${v === 1 ? 'estrela' : 'estrelas'}">★</button>`).join('')}<span class="lbl" id="rv-lbl">${['Toque para dar a nota','Ruim','Fraco','Ok','Bom','Ótimo'][st]}</span></div>
    <div class="rv-wrap"><textarea id="rv-text" class="rv-ta" maxlength="1000" placeholder="O que achou do treino? Alguma dúvida? Escreva ou toque no 🎤 e fale." aria-label="Comentários e dúvidas sobre o treino"></textarea>
    ${SR ? `<button class="mic" data-act="rv-mic" aria-label="Falar em vez de escrever" aria-pressed="false">${ICON.mic}</button>` : ''}</div>
    <p class="mic-st" id="rv-mic-st">${SR ? 'Toque no 🎤 para falar. Toque de novo para parar.' : 'Dica: use o microfone do teclado para ditar.'}</p>
    <button class="btn" data-act="rv-send" data-day="${dayKey}" data-date="${date}">Enviar avaliação</button>`;
  } else h += `<p class="hint" style="margin-bottom:10px">Avaliação ${date === ymd() ? 'de hoje ' : ''}enviada. <button class="tbtn" data-act="rv-again" data-date="${date}">Avaliar de novo</button></p>`;
  if(mine.length) h += `<div style="margin-top:12px">${mine.map(cmItem).join('')}</div>`;
  return h + (embed ? '</div>' : '</section>');
}
function cmCard(){
  const nw = (S.notes || []).filter(n => n.claude && !S.cmSeen.has(n.id));
  if(!nw.length) return '';
  return `<section class="card glass cm-new"><h3>💬 O Claude respondeu ${nw.length === 1 ? 'sua avaliação' : nw.length + ' avaliações'}</h3>
    ${nw.slice(-3).map(n => `<p class="hint" style="margin:10px 0 4px"><b style="color:var(--text)">${esc(n.exName)}</b></p>` + cmItem(n)).join('')}
    <button class="btn sm ghost" data-act="cm-seen">Ok, li</button></section>`;
}
// ditado por voz (reconhecimento de fala do Chrome, em português, grátis)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function micStop(){ try{ rec && rec.stop(); }catch(e){} }
function micToggle(btn){
  if(rec){ micStop(); return; }
  const ta = document.getElementById('rv-text'), st = document.getElementById('rv-mic-st');
  if(!ta || !SR) return;
  const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  let finalTxt = '';
  rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => { let interim = ''; for(let i = e.resultIndex; i < e.results.length; i++){ const r = e.results[i]; if(r.isFinal) finalTxt += r[0].transcript + ' '; else interim += r[0].transcript; } ta.value = (base + finalTxt + interim).slice(0, 1000); };
  rec.onstart = () => { btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true'); if(st) st.textContent = '🔴 Ouvindo… fale à vontade. Toque no 🎤 para parar.'; };
  rec.onerror = e => { if(st) st.textContent = e.error === 'not-allowed' ? 'Permita o microfone para o app nas configurações.' : e.error === 'no-speech' ? 'Não ouvi nada. Toque no 🎤 e tente de novo.' : 'O ditado parou. Toque no 🎤 para continuar.'; };
  rec.onend = () => { rec = null; btn.classList.remove('on'); btn.setAttribute('aria-pressed', 'false'); if(st && st.textContent.startsWith('🔴')) st.textContent = 'Pronto. Confira o texto e envie, ou toque no 🎤 para falar mais.'; ta.value = ta.value.replace(/\s+$/, ''); };
  try{ rec.start(); }catch(e){ rec = null; }
}
async function rvSend(dayKey = S.day, date = ymd()){
  micStop();
  const ta = document.getElementById('rv-text'), text = (ta && ta.value || '').trim(), rating = S.rvStars || null;
  if(!text && !rating){ toast('Dê uma nota ou escreva um comentário'); return; }
  const plan = PLAN[dayKey], d = date === ymd() ? draft(dayKey) : { log:{}, wt:{} }, today = date;
  const lastPain = [...S.pain].sort((a, b) => b.ts - a.ts)[0];
  const sess = S.sessions.filter(x => x.date === date && x.day === dayKey).sort((a, b) => b.finishedAt - a.finishedAt)[0];
  const feito = plan.ex.map(ex => { const sets = (sess && sess.log && sess.log[ex.id]) || (date === ymd() ? ((d.log || {})[ex.id] || []).filter(x => x.done) : []); if(!sets.length) return null; const w = Math.max(0, ...sets.map(x => +x.w || 0)) || (date === ymd() && d.wt ? parseFloat(String(d.wt[ex.id] || '').replace(',', '.')) || 0 : 0); return `${ex.name} ${sets.length}/${ex.sets}${w ? ' (' + fmtNum(w) + ' kg)' : ''}`; }).filter(Boolean).join('; ');
  const btn = document.querySelector('[data-act="rv-send"]'); if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }
  try{
    const r = await api('/note', { uid:myUid(), app:'th', date, ex:'treino-' + dayKey, exName:`${TYPES[plan.type].label} · ${plan.title}`, text, rating,
      ctx:{ series: plan.ex.map(e => `${e.name} ${e.sets}×${e.reps}`).join('; '), load: feito || 'nenhuma série marcada', phase:'', pain: lastPain ? lastPain.value : null, obs: plan.note } });
    S.notes.push(r.note); cmSave(); S.rvStars = 0; S.rvAgain = null; render(); toast('Avaliação enviada');
    setTimeout(() => { const el = document.querySelector('.rv'); if(el) el.scrollIntoView({ behavior:'smooth', block:'center' }); }, 100);
  }catch(e){ toast(navigator.onLine ? 'Não deu pra enviar. Tente de novo.' : 'Sem internet. Tente de novo depois.'); if(btn){ btn.disabled = false; btn.textContent = 'Enviar avaliação'; } }
}
async function cmDecide(id, no){
  try{ const r = await api('/approve', { uid:myUid(), id, no:!!no }); const n = S.notes.find(x => x.id === id); if(n) n.change = r.change; cmSave(); render(); toast(no ? 'Ok, fica como está' : 'Aprovado! O Claude aplica às 22h.'); }
  catch(e){ toast('Não deu pra enviar. Tente de novo.'); }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) cmFetch(); });

const wLabel = (w, id) => fmtNum(w) + ' kg', wVal = (w, id) => w;
const INC = 2.5; // passo da progressão de carga (kg)
const incFor = id => INC;
const maxW = arr => Math.max(0, ...arr.map(x => +x.w || 0));
// recordes: maior carga do exercício, ou mais repetições com a carga recorde
function findPRs(log){
  const out = [];
  Object.entries(log).forEach(([id, sets]) => {
    const w = maxW(sets); if(!w) return;
    const prev = S.sessions.filter(s => s.log && s.log[id] && s.log[id].length);
    if(!prev.length) return; // primeiro registro não conta como recorde
    const pw = Math.max(...prev.map(s => maxW(s.log[id])));
    const name = (ALLEX[id] || {}).name || id;
    if(w > pw) out.push({ id, name, kind:'carga', w, txt:`${name}: ${wLabel(w, id)} (antes ${wLabel(pw, id)})` });
    else if(w === pw){
      const r = Math.max(...sets.filter(x => +x.w === w).map(x => +x.r || 0));
      const pr = Math.max(0, ...prev.flatMap(s => s.log[id].filter(x => +x.w === w).map(x => +x.r || 0)));
      if(r > pr && pr) out.push({ id, name, kind:'reps', w, r, txt:`${name}: ${r} reps com ${wLabel(w, id)} (antes ${pr})` });
    }
  });
  return out;
}
const prList = s => s && s.prs && s.prs.length ? `<div class="prs"><b>🏆 ${s.prs.length === 1 ? 'Novo recorde!' : s.prs.length + ' novos recordes!'}</b>${s.prs.map(p => esc(p.txt)).join('<br>')}</div>` : '';
// sugestão de carga (progressão dupla simples): 2 treinos completos com a mesma carga → sobe um passo
function sugLoad(ex){
  if(ex.kind === 'time') return null;
  const hist = sessionsDesc().filter(s => !s.manual && s.log && s.log[ex.id] && s.log[ex.id].length);
  if(!hist.length) return null;
  const w0 = maxW(hist[0].log[ex.id]); if(!w0) return null;
  const full = s => s.log[ex.id].length >= ex.sets;
  const pain = S.pain.filter(p => dayDiff(new Date(), parseYmd(p.date)) <= 7).map(p => p.value);
  if(pain.length && Math.max(...pain) >= 5) return { w:w0, why:'dor alta nesta semana: mantenha a carga' };
  if(hist.length >= 2 && full(hist[0]) && full(hist[1]) && maxW(hist[1].log[ex.id]) === w0) return { w:w0 + incFor(ex.id), up:true, why:`2 treinos completos com ${wLabel(w0, ex.id)}` };
  if(!full(hist[0])) return { w:w0, why:'complete todas as séries antes de subir' };
  return { w:w0, why:'mais um treino completo e a carga sobe' };
}
function sugHtml(ex, d){
  const g = sugLoad(ex); if(!g) return '';
  const cur = String(d.wt[ex.id] ?? '');
  return `<div class="sug ${g.up ? 'up' : ''}">💡 Sugestão: <b>${wLabel(g.w, ex.id)}</b><span>· ${g.why}</span>${cur === '' || Math.abs(num(cur) - wVal(g.w, ex.id)) > .01 ? `<button class="tbtn" data-act="sug-use" data-ex="${ex.id}" data-w="${g.w}">Usar</button>` : ''}</div>`;
}
// resumo da semana (segunda a domingo)
function weekStats(off = 0){
  const m = addDays(mondayOf(new Date()), -7 * off), e = addDays(m, 7);
  const ss = S.sessions.filter(s => { const d = parseYmd(s.date); return d >= m && d < e; });
  const pain = S.pain.filter(p => { const d = parseYmd(p.date); return d >= m && d < e; }).map(p => p.value);
  return { start:ymd(m), n:ss.length, sets:ss.reduce((a, s) => a + (s.sets || 0), 0), vol:ss.reduce((a, s) => a + (s.volume || 0), 0),
    prs:ss.reduce((a, s) => a + ((s.prs || []).length), 0), pain: pain.length ? pain.reduce((a, b) => a + b, 0) / pain.length : null };
}
function weekText(){
  const w = weekStats(0), p = weekStats(1);
  if(!w.n) return null;
  const dv = p.vol ? Math.round((w.vol - p.vol) / p.vol * 100) : null;
  return `${w.n} ${w.n === 1 ? 'treino' : 'treinos'} · ${w.sets} séries · volume ${fmtNum(w.vol / 1000)} t${dv != null ? ` (${dv >= 0 ? '+' : ''}${dv}% vs semana passada)` : ''}${w.prs ? ` · 🏆 ${w.prs} ${w.prs === 1 ? 'recorde' : 'recordes'}` : ''}${w.pain != null ? ` · dor média ${fmtNum(w.pain)}` : ''}`;
}
function weekCard(){
  const w = weekStats(0), p = weekStats(1);
  const dv = p.vol ? Math.round((w.vol - p.vol) / p.vol * 100) : null;
  return `<section class="card glass wk-sum"><h3>Esta semana</h3><p class="hint" style="margin:0">${w.n ? 'Domingo à noite chega o resumo no celular.' : 'Nenhum treino registrado ainda nesta semana.'}</p>
    <div class="stats"><div class="stat"><b>${w.n}</b><span>treinos</span></div><div class="stat"><b>${fmtNum(w.vol / 1000)}t</b><span>volume${dv != null ? ` <i class="delta ${dv >= 0 ? 'up' : 'down'}">${dv >= 0 ? '+' : ''}${dv}%</i>` : ''}</span></div><div class="stat"><b>${w.prs}</b><span>recordes</span></div></div></section>`;
}
// manda o texto da semana para o servidor, que envia o push no domingo às 20h
function pushWeek(){
  if(!S.pushOn || !navigator.onLine) return;
  const t = weekText(); if(!t) return;
  api('/summary', { uid:myUid(), week:weekStats(0).start, text:t }).catch(() => {});
}

/* ---------- tela de abertura: só quando o app abre do zero (não ao voltar de outro app) ---------- */
function showIntro(){
  const el = document.getElementById('intro');
  if(location.hash){ el.classList.add('off'); return; } // aberto por notificação: vai direto
  const ci = cycleInfo(), plan = PLAN[todayKey()];
  document.getElementById('introWk').textContent = (ci.notStarted ? 'Ciclo começa em breve' : `Semana ${ci.week} de ${ci.weeks}`) + ' · hoje: ' + (plan.type === 'rest' ? 'descanso' : TYPES[plan.type].label);
  const hide = () => el.classList.add('off');
  el.addEventListener('click', hide, { once:true });
  setTimeout(hide, 10000); // fica até o toque, ou some sozinha em 10 s
}

/* ---------- início ---------- */
(function boot(){
  const L = lsLoad();
  S.program = L.program || defaultProgram();
  seed31();
  S.pushOn = !!localStorage.getItem('treino-push-on');
  cmLoad();
  S.drafts = L.drafts || {}; S.sessions = L.sessions || []; S.pain = L.pain || [];
  Object.keys(S.drafts).forEach(k => { if(!S.drafts[k] || S.drafts[k].date !== ymd()) delete S.drafts[k]; });
  const h = location.hash.slice(1); if(['treino','progresso','joelho','guia'].includes(h)) S.tab = h;
  spLoad();
  const spBack = location.search.includes('code=') || location.search.includes('error=');
  render();
  if(spBack) document.getElementById('intro').classList.add('off'); else showIntro();
  spHandleRedirect().then(back => { if(!back) spStart(); });
  cmFetch();
  pushWeek();
  if(S.pushOn) syncPush().catch(() => {}); // liga o celular às respostas do Claude
  persistStorage();
  if(PWA) navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
})();
