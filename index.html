// limpa o que veio da IA ou do leitor: nomes, séries 1–12, repetições em texto, descanso em segundos
function normWorkouts(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map((w, i) => ({
    name: String(w.name || '').trim().slice(0, 40) || 'Treino ' + ('ABCDEFG'[i] || i + 1),
    focus: String(w.focus || '').trim().slice(0, 60).replace(/^./, c => c.toUpperCase()), note: String(w.note || '').trim().slice(0, 200),
    days: (Array.isArray(w.days) ? w.days : []).map(x => String(x).toLowerCase().slice(0, 3).normalize('NFD').replace(/[̀-ͯ]/g, '')).filter(x => DAYS.includes(x)),
    ex: (Array.isArray(w.ex) ? w.ex : []).map(e => {
      const sets = parseInt(e.sets, 10), rest = parseInt(e.rest, 10);
      let reps = String(e.reps ?? '').trim().replace(/\s*(?:a|-)\s*(?=\d)/g, '–').slice(0, 24);
      const chk = [e.chk || '', e.uncertain ? String(e.uncertain === true ? 'leitura incerta' : e.uncertain) : '', !(sets > 0) ? 'número de séries' : '', !reps ? 'repetições' : ''].filter(Boolean).join(', ');
      return { name:String(e.name || '').trim().slice(0, 70), sets: sets > 0 ? Math.min(12, sets) : 3, reps: reps || '10–12', rest: rest >= 0 && rest <= 600 ? rest : 60, obs:String(e.obs || '').trim().slice(0, 160), ...(chk ? { chk } : {}) };
    }).filter(e => e.name.length > 1)
  })).filter(w => w.ex.length).slice(0, 7);
}
// dias padrão: 1 treino = seg/qua/sex; 2 = A seg/qui, B ter/sex; 3 = seg/qua/sex; 4 = seg/ter/qui/sex; 5+ = seg em diante
function assignDays(ws){
  const taken = new Set();
  ws.forEach(w => { w.days = (w.days || []).filter(k => !taken.has(k)); w.days.forEach(k => taken.add(k)); });
  const free = ws.filter(w => !w.days.length); if(!free.length) return;
  const pat = { 1:[['seg','qua','sex']], 2:[['seg','qui'],['ter','sex']], 3:[['seg'],['qua'],['sex']], 4:[['seg'],['ter'],['qui'],['sex']] }[ws.length]
    || ws.map((_, i) => [DAYS[i]]).slice(0, 7);
  ws.forEach((w, i) => { if(!w.days.length) w.days = ((pat[i] || [])).filter(k => !taken.has(k)); w.days.forEach(k => taken.add(k)); });
}
const blankWorkout = i => ({ name:'Treino ' + ('ABCDEFG'[i] || i + 1), focus:'', days:[], ex:[{ name:'', sets:3, reps:'10–12', rest:60, obs:'' }] });

/* ---------- leitor de texto (sem IA) ----------
   Entende “Supino reto 4x10”, “4 x 8-10”, “3 séries de 12”, “Prancha 3x30s”, tabelas “nome | 4 | 10 | 60”,
   nome numa linha e “4x10” na seguinte, cabeçalhos “Treino A - Peito”, “A)”, “SEGUNDA”, “Costas e bíceps:”. */
const nrm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const WDN = { segunda:'seg', terca:'ter', quarta:'qua', quinta:'qui', sexta:'sex', sabado:'sab', domingo:'dom' };
const REP = '(?:\\d{1,3}(?:\\s*(?:a|-|–|/|,|ou)\\s*\\d{1,3})*(?:\\s*(?:s|seg|segundos|min|minutos|reps?|repeticoes|rep)\\b)?|(?:ate a )?falha|max(?:imo)?)';
const SETREP = new RegExp('(\\d{1,2})\\s*(?:x|×|\\*|series?\\s*(?:de\\s*)?)\\s*(' + REP + ')', 'i');
const RESTRX = /(?:desc(?:anso)?|intervalo|pausa)\s*(?:de\s*)?:?\s*(\d{1,3})\s*(s|seg|segundos|"|min|minutos?|'|m)?|(\d{1,3})\s*(s|seg|segundos|"|min|minutos?|')\s*(?:de\s*)?(?:desc|interv|pausa)/;
function restSec(m){ if(!m) return null; const v = +(m[1] || m[3]), u = (m[2] || m[4] || 's'); return /^m|'/.test(u) ? v * 60 : v; }
function headerInfo(l){
  const n = nrm(l).trim();
  const days = Object.keys(WDN).filter(k => n.includes(k)).map(k => WDN[k]);
  let name = '', focus = l;
  let m = n.match(/^(?:treino|ficha|rotina|sessao|workout|day|dia)\s*([a-z]|\d{1,2})?(?![a-z])/);
  if(m){ name = m[1] ? 'Treino ' + m[1].toUpperCase() : ''; focus = l.slice(m[0].length).replace(/^\s*(?:de|do|da)\s+/i, ''); }
  else if((m = n.match(/^([a-g])\s*(?:[-–:).|]|$)/))){ name = 'Treino ' + m[1].toUpperCase(); focus = l.slice(m[0].length); }
  else if((m = n.match(/^(segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:[- ]feira)?/))){ focus = l.slice(m[0].length); }
  focus = focus.replace(/\((?:[^)]*(?:segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)[^)]*)\)/gi, '').replace(/^[\s\-–:.)|]+|[\s:–\-|]+$/g, '').trim();
  if(focus && focus === focus.toUpperCase()) focus = focus.charAt(0) + focus.slice(1).toLowerCase();
  return { name, focus, days };
}
function cleanName(s){
  return s.replace(/^[\s\-–•*·▪►>✓✔#]*(?:\d{1,2}\s*[.)º°-]\s*)?/, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').replace(/\s*[-–:|,;]+\s*$/, '').replace(/^\s*[-–:|,;]+\s*/, '').replace(/\s{2,}/g, ' ').trim();
}
function repsTxt(r){
  let x = String(r).trim().replace(/\s*(?:reps?|repetições|repeticoes|rep)\b/i, '').replace(/\s*(?:a|-|ou)\s*(?=\d)/g, '–').replace(/\s*\/\s*/g, '/');
  if(/falha/i.test(x)) return 'até a falha';
  if(/^m[aá]x/i.test(x)) return 'máximo';
  return x.replace(/(\d)\s*(segundos|seg)\b/i, '$1 s').replace(/(\d)\s*(minutos|min)\b/i, '$1 min');
}
function localParse(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/\t/g, ' | ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const ws = []; let cur = null, lastEx = null, prev = null;
  const ensure = () => { if(!cur){ cur = { name:'', focus:'', days:[], ex:[], rest:null }; ws.push(cur); } return cur; };
  const isHeaderLine = (l, n) => {
    if(SETREP.test(n) || l.length > 60) return false;
    if(/^(treino|ficha|rotina|sessao|workout|day)\b/.test(n) || /^dia\s*(\d|[a-g]\b)/.test(n)) return true;
    if(/^(segunda|terca|quarta|quinta|sexta|sabado|domingo)/.test(n)) return true;
    if(/^[a-g]\s*(?:[-–:).|]\s*\S|$)/.test(n)) return true;
    if(/:$/.test(l) && !/^(obs|observ|dica|nota|aquec)/.test(n)) return true;
    return l.length >= 4 && l === l.toUpperCase() && /[A-ZÀ-Ú]{3}/.test(l) && !/\d/.test(l) ? 'caps' : false;
  };
  for(const l of lines){
    const n = nrm(l);
    if(/^(obs|observ|dica|nota|importante)\b/.test(n)){ if(lastEx) lastEx.obs = (lastEx.obs ? lastEx.obs + ' ' : '') + l.replace(/^[^:]*:\s*/, '').slice(0, 160); continue; }
    const rOnly = n.match(RESTRX);
    if(rOnly && !SETREP.test(n) && cleanName(l.replace(/(?:desc(?:anso)?|intervalo|pausa)[^]*$/i, '')).length < 3){ const sec = restSec(rOnly); if(lastEx && !lastEx._restSet && prev === lastEx){ lastEx.rest = sec; lastEx._restSet = true; } else ensure().rest = sec; continue; }
    // tabela: nome | séries | repetições | descanso
    const cells = l.split(/\s*[|;]\s*/).map(c => c.replace(/^"|"$/g, '').trim()).filter(c => c !== '');
    if(cells.length >= 3 && !/\d/.test(l) && /exerc|s[eé]ries|reps|repeti|descanso|carga/i.test(l)) continue; // cabeçalho da tabela
    if(cells.length >= 3 && /^\d{1,2}$/.test(cells[1]) && new RegExp('^' + REP + '$', 'i').test(nrm(cells[2])) && /[a-zà-ú]{3}/i.test(cells[0])){
      lastEx = { name:cleanName(cells[0]), sets:+cells[1], reps:repsTxt(cells[2]), rest: cells[3] && /^\d{1,3}/.test(cells[3]) ? (/min|'/.test(cells[3]) ? parseInt(cells[3], 10) * 60 : parseInt(cells[3], 10)) : null, obs:cells.slice(4).join(' ').slice(0, 160) };
      ensure().ex.push(lastEx); prev = lastEx; continue;
    }
    const sr = n.match(SETREP);
    if(sr){
      const before = l.slice(0, sr.index), after = l.slice(sr.index + sr[0].length);
      let name = cleanName((before + ' ' + after.replace(RESTRX, '').replace(/^\s*(?:reps?|repetições|repeticoes)\b/i, '')).replace(/\(\s*\)/g, ''));
      const rm = n.match(RESTRX);
      if(name.length < 3 && prev && prev._pending){ // nome na linha de cima
        prev.sets = +sr[1]; prev.reps = repsTxt(sr[2]); if(rm) prev.rest = restSec(rm); delete prev._pending; delete prev.chk; lastEx = prev; continue;
      }
      if(name.length < 3 && prev && prev._caps){ // a linha de cima em MAIÚSCULAS era o exercício, não o treino
        const w = ws.pop(); cur = ws[ws.length - 1] || null;
        lastEx = { name:prev._caps, sets:+sr[1], reps:repsTxt(sr[2]), rest: rm ? restSec(rm) : null, obs:'' }; ensure().ex.push(lastEx); prev = lastEx; if(w && w.ex.length) ws.push(w); continue;
      }
      if(name.length < 3) continue;
      lastEx = { name, sets:+sr[1], reps:repsTxt(sr[2]), rest: rm ? restSec(rm) : null, obs:'' };
      ensure().ex.push(lastEx); prev = lastEx; continue;
    }
    const hd = isHeaderLine(l, n);
    if(hd){
      const h = headerInfo(l);
      cur = { name:h.name, focus:h.focus, days:h.days, ex:[], rest:null }; ws.push(cur); lastEx = null;
      prev = hd === 'caps' ? { _caps: l.charAt(0) + l.slice(1).toLowerCase() } : null;
      continue;
    }
    if(l.length <= 60 && /[a-zà-ú]{3}/i.test(l) && !/[.!?]$/.test(l) && l.split(' ').length <= 8){ // nome sem séries: confere depois
      lastEx = { name:cleanName(l), sets:3, reps:'10–12', rest:null, obs:'', chk:'séries e repetições não encontradas', _pending:true };
      if(lastEx.name.length >= 3){ ensure().ex.push(lastEx); prev = lastEx; } continue;
    }
  }
  const out = ws.filter(w => w.ex.length);
  out.forEach((w, i) => {
    if(!w.name) w.name = 'Treino ' + ('ABCDEFG'[i] || i + 1);
    w.ex.forEach(e => { if(e.rest == null) e.rest = w.rest != null ? w.rest : 60; delete e._pending; delete e._restSet; });
  });
  return out;
}

/* ---------- compartilhar o app ---------- */
function shareApp(){
  const url = location.origin + location.pathname;
  const text = 'Monta o seu treino nesse app: faz o cadastro e manda a sua ficha (foto, PDF ou texto). Depois instala no celular.';
  if(navigator.share) navigator.share({ title:'App de treino', text, url }).catch(() => {});
  else copyText(text + ' ' + url, 'Link copiado');
}

/* ---------- tela de abertura: só quando o app abre do zero (não ao voltar de outro app) ---------- */
// marca de amigo: a abertura é o vídeo dele (Remotion), que termina na cor de fundo do app
function brandIntro(){
  const el = document.getElementById('intro');
  el.innerHTML = `<video src="${brandFile(BR.intro)}" muted playsinline autoplay preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`;
  el.style.background = BR.bg; el.style.zIndex = 80; el.classList.remove('off');
  const v = el.querySelector('video'); let done = false;
  const hide = () => { if(done) return; done = true; el.classList.add('off'); };
  v.addEventListener('ended', hide); v.addEventListener('error', hide); el.addEventListener('click', hide, { once:true });
  setTimeout(hide, 7000);
  const p = v.play(); if(p && p.catch) p.catch(() => setTimeout(hide, 300));
}
function showIntro(){
  const el = document.getElementById('intro');
  if(location.hash){ el.classList.add('off'); return; } // aberto por notificação: vai direto
  if(branded() && BR.intro) return brandIntro();
  const ci = cycleInfo(), plan = PLAN[todayPlan()];
  document.getElementById('introWk').textContent = (ci.notStarted ? 'Ciclo começa em breve' : `Semana ${ci.week} de ${ci.weeks}`) + ' · hoje: ' + (plan.type === 'rest' ? 'descanso' : TYPES[plan.type].label);
  const hide = () => el.classList.add('off');
  el.addEventListener('click', hide, { once:true });
  setTimeout(hide, 10000); // fica até o toque, ou some sozinha em 10 s
}

/* ---------- início ---------- */
(function boot(){
  const L = lsLoad();
  PF = pfLoad();
  if(/[?&]perfil=th/.test(location.search)) PF = { kind:'th' }; // escape: força o perfil do Thiago num aparelho novo
  // aparelho sem nada = cadastro; com dados antigos e sem perfil = celular do Thiago
  const fresh = !PF && !L.program && !(L.sessions || []).length;
  if(!PF && !fresh){ PF = { kind:'th' }; pfSave(); }
  FRESH = fresh; brandLoad();
  S.program = L.program || defaultProgram();
  applyProfile();
  if(!fresh){ seed31(); pfToSW(); }
  S.pushOn = !!localStorage.getItem('treino-push-on');
  S.day = todayPlan();
  cmLoad();
  S.drafts = L.drafts || {}; S.sessions = L.sessions || []; S.pain = L.pain || [];
  Object.keys(S.drafts).forEach(k => { if(!S.drafts[k] || S.drafts[k].date !== ymd()) delete S.drafts[k]; });
  const h = location.hash.slice(1); if(['treino','progresso','joelho','guia'].includes(h)) S.tab = h;
  spLoad();
  const spBack = location.search.includes('code=') || location.search.includes('error=');
  render();
  if(fresh){ onbOpen('novo'); if(branded() && BR.intro) brandIntro(); else document.getElementById('intro').classList.add('off'); }
  else if(spBack) document.getElementById('intro').classList.add('off'); else showIntro();
  spHandleRedirect().then(back => { if(!back) spStart(); });
  cmFetch();
  pushWeek();
  if(S.pushOn) syncPush().catch(() => {}); // liga o celular às respostas do Claude
  persistStorage();
  if(PWA) navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
})();
